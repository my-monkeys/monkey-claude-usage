name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Signing and notarization need a Developer ID certificate and an App Store
# Connect key, neither of which is available to Actions: releases are cut
# locally with scripts/release.sh. See docs/RELEASING.md.
jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        # The Liquid Glass path needs the Tahoe SDK; on an older image the code compiles
        # its fallback instead, which is exactly what this job is here to keep working.
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
